name: Bug report
description: Report a reproducible problem with a migration command
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, SSH keys, private hostnames, and customer data before
        submitting. Report security vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gitlab-migrator --version` or the commit SHA.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command and options used, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or traceback.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, source GitLab, and destination GitLab versions.
    validations:
      required: true
