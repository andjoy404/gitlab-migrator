services:
  init-permissions:
    image: ${GITLAB_MIGRATOR_IMAGE:-ghcr.io/andjoy404/gitlab-migrator:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/reports /data/repositories /data/keys &&
        chown -R ${USER_ID:-1000}:${GROUP_ID:-1000}
        /data/reports /data/repositories /data/keys
    volumes:
      - ../data:/data
    restart: "no"

  gitlab-migrator:
    image: ${GITLAB_MIGRATOR_IMAGE:-ghcr.io/andjoy404/gitlab-migrator:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: gitlab-migrator
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    command: ["sleep", "infinity"]
    env_file:
      - ../.env
    environment:
      GITLAB_MIGRATOR_OUTPUT_DIR: /data/reports
      GITLAB_MIGRATOR_WORKSPACE_DIR: /data/repositories
    volumes:
      - ../data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
